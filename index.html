---
layout: default
---

<div class="feed">
	{%- for post in site.posts %}
	<article class="post-item{% if post.tags contains 'deprecated' %} archived{% endif %}">
		{% include post-meta.html post=post %}
		<h2 class="entry-title"><a href="{{ post.url | prepend: site.baseurl }}" rel="bookmark">{{ post.title }}</a></h2>
		<p class="excerpt">{{ post.excerpt | strip_html | strip_newlines }}</p>
	</article>
	{%- endfor %}
</div>
